<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>lily.srv.thedevs.cz</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #010409;
      --border: #21262d;
      --fg: #c9d1d9;
      --dim: #6e7681;
      --accent: #3fb950;
      --link: #58a6ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de;
        --fg: #1f2328; --dim: #656d76; --accent: #1a7f37; --link: #0969da;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                   "Liberation Mono", "Roboto Mono", monospace;
      font-size: 15px;
      line-height: 1.7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 40rem; }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 24px 70px -28px rgba(0, 0, 0, .55);
    }
    .bar {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .65rem .9rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .dot { width: .72rem; height: .72rem; border-radius: 50%; display: inline-block; }
    .dot.r { background: #ff5f56; }
    .dot.y { background: #ffbd2e; }
    .dot.g { background: #27c93f; }
    .bar .title {
      margin-left: .55rem;
      font-size: .78rem;
      letter-spacing: .02em;
      color: var(--dim);
    }
    .body { padding: 1.5rem 1.6rem 1.9rem; }
    .line { margin: .2rem 0; }
    .prompt::before { content: "$ "; color: var(--dim); }
    .prompt { color: var(--accent); }
    h1 { font-size: 1.55rem; margin: .35rem 0 1.1rem; font-weight: 600; letter-spacing: -.01em; }
    p { margin: .35rem 0; }
    .ok { color: var(--accent); }
    .muted { color: var(--dim); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .contact { margin-top: 1.2rem; }
    .cursor {
      display: inline-block;
      width: .55rem;
      height: 1.05rem;
      background: var(--accent);
      margin-left: .2rem;
      vertical-align: -.16rem;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="title">lily.srv.thedevs.cz — /bin/sh</span>
      </div>
      <div class="body">
        <p class="line prompt">whoami</p>
        <h1>Hello from us&nbsp;👋</h1>
        <p class="line"><span class="ok">●</span> this server is up and running.<span class="cursor"></span></p>
        <p class="line muted">nothing public to see here — just a happy little box doing its job.</p>
        <p class="line contact">need to reach out? <a href="mailto:j.mikes@me.com">j.mikes@me.com</a></p>
      </div>
    </div>
  </main>
</body>
</html>
